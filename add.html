<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Add Book">
<title>Add a book</title>
<style>
:root{color-scheme:light dark;font:16px -apple-system,system-ui,sans-serif}
body{margin:0 auto;padding:16px;max-width:520px}
h1{font-size:20px;margin:4px 0 8px}
label{display:block;margin:12px 0 4px;font-size:13px;opacity:.7}
input,select,textarea,button{width:100%;box-sizing:border-box;font:inherit;padding:10px;border-radius:8px;border:1px solid #8886}
button{margin-top:12px;background:#2e5bff;color:#fff;border:0;font-weight:600}
button.sec{background:#8883;color:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
#cover{width:auto;height:110px;margin-top:8px;border:0;display:none}
#msg{margin-top:14px;white-space:pre-wrap;font-size:14px}
a{color:#2e5bff}
</style></head><body>
<h1>Add a book</h1>

<div id="tokbox" style="display:none">
  <label>GitHub token (fine-grained, repo voyacosmo, Contents: read/write). Stored on this phone only.</label>
  <input id="tok" type="password" autocomplete="off" placeholder="github_pat_...">
  <button onclick="saveTok()">Save token</button>
</div>

<div id="form">
  <label>ISBN (optional)</label>
  <div class="row"><input id="isbn" inputmode="numeric" placeholder="978..."><button class="sec" style="margin:0" onclick="lookup()">Look up</button></div>
  <img id="cover" alt="">
  <label>Title</label><input id="title">
  <label>Author (full name)</label><input id="author">
  <label>Country</label><select id="country" onchange="cchg()"></select>
  <div id="newc" style="display:none">
    <label>New country name</label><input id="ncname">
    <label>Map point: longitude, latitude (e.g. 12.50, 41.90)</label><input id="ncpt" placeholder="12.50, 41.90">
  </div>
  <label>Month read (optional)</label><input id="date" type="month">
  <label>Blurb (one spoiler-free sentence)</label><textarea id="blurb" rows="3"></textarea>
  <button onclick="add()">Add to site</button>
  <button class="sec" onclick="resetTok()">Change token</button>
</div>
<div id="msg"></div>

<script>
const REPO="ccanty/voyacosmo",API="https://api.github.com/repos/"+REPO+"/contents/index.html";
const $=id=>document.getElementById(id);
let src="",sha="",known={};
const say=t=>$("msg").textContent=t;
const tok=()=>{try{return localStorage.getItem("gh")||""}catch(e){return ""}};
const hdr=()=>({Authorization:"Bearer "+tok(),Accept:"application/vnd.github+json"});
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const enc=s=>{const u=new TextEncoder().encode(s);let b="";for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(b)};

function saveTok(){try{localStorage.setItem("gh",$("tok").value.trim())}catch(e){}init()}
function resetTok(){try{localStorage.removeItem("gh")}catch(e){}init()}

async function load(){
  const r=await fetch(API,{headers:hdr(),cache:"no-store"});
  if(!r.ok)throw new Error("GitHub error "+r.status+(r.status==401||r.status==404?" - check token/repo access":""));
  const j=await r.json();sha=j.sha;src=dec(j.content);
  known={};
  for(const m of src.matchAll(/country:\s*"([^"]+)"[\s\S]*?anchor:\s*\[([^\]]+)\]/g))known[m[1]]=m[2].trim();
}
async function init(){
  const has=!!tok();
  $("tokbox").style.display=has?"none":"block";
  $("form").style.display=has?"block":"none";
  if(!has)return;
  say("Loading...");
  try{
    await load();
    $("country").innerHTML=Object.keys(known).sort().map(c=>`<option>${c}</option>`).join("")+'<option value="__new">+ New country...</option>';
    cchg();say("");
  }catch(e){say(e.message)}
}
function cchg(){$("newc").style.display=$("country").value=="__new"?"block":"none"}

$("isbn").addEventListener("input",()=>{
  const i=$("isbn").value.replace(/\D/g,""),c=$("cover");
  if(i.length>=10){c.src="https://covers.openlibrary.org/b/isbn/"+i+"-M.jpg";c.style.display="block"}else c.style.display="none";
});
async function lookup(){
  const i=$("isbn").value.replace(/\D/g,"");if(!i)return say("Enter an ISBN first.");
  say("Looking up...");
  try{
    const r=await fetch("https://openlibrary.org/api/books?bibkeys=ISBN:"+i+"&format=json&jscmd=data");
    const d=(await r.json())["ISBN:"+i];
    if(!d)return say("No match on Open Library.");
    if(!$("title").value)$("title").value=d.title||"";
    if(!$("author").value&&d.authors)$("author").value=d.authors.map(a=>a.name).join(", ");
    say("Filled in what was found. Check it.");
  }catch(e){say("Lookup failed.")}
}

function hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))));return"#"+[f(0),f(8),f(4)].map(x=>x.toString(16).padStart(2,"0")).join("")}

function entry(){
  const q=JSON.stringify,t=$("title").value.trim(),a=$("author").value.trim();
  let c=$("country").value,pt=known[c];
  if(c=="__new"){
    c=$("ncname").value.trim();
    const p=$("ncpt").value.split(",").map(x=>parseFloat(x));
    if(!c||p.length!=2||p.some(isNaN))throw new Error("Enter the new country name and 'lng, lat'.");
    pt=p[0].toFixed(2)+", "+p[1].toFixed(2);
  }
  if(!t||!a)throw new Error("Title and author are required.");
  const isbn=$("isbn").value.replace(/\D/g,""),d=$("date").value,b=$("blurb").value.trim();
  const h=Math.floor(Math.random()*360);
  const L=[`title: ${q(t)}`,`author: ${q(a)}`,`country: ${q(c)}`];
  if(isbn)L.push(`isbn: "${isbn}"`);
  L.push(`anchor: [${pt}]`);
  if(d)L.push(`date: "${d}-15"`);
  if(b)L.push(`blurb: ${q(b)}`);
  L.push(`colors: ["${hex(h,45,18)}", "${hex(h,50,84)}"]`);
  return "    {\n"+L.map(l=>"      "+l).join(",\n")+"\n    }";
}

async function add(){
  try{
    const e=entry();
    say("Saving...");
    await load();
    const s=src.indexOf("const BOOKS_RAW = [");
    if(s<0)throw new Error("BOOKS_RAW not found in index.html.");
    const re=/\n[ \t]*\];/g;re.lastIndex=s;const m=re.exec(src);
    if(!m)throw new Error("Closing ]; not found.");
    let before=src.slice(0,m.index).replace(/\s+$/,"");
    if(!before.endsWith(","))before+=",";
    const out=before+"\n"+e+src.slice(m.index);
    const d=$("date").value;
    const clash=d&&[...src.matchAll(/date:\s*"(\d{4}-\d{2})/g)].some(x=>x[1]==d);
    const r=await fetch(API,{method:"PUT",headers:hdr(),body:JSON.stringify({message:"Add book: "+$("title").value.trim(),content:enc(out),sha})});
    if(!r.ok)throw new Error("Commit failed ("+r.status+"). "+(await r.text()).slice(0,150));
    say("Added! Live in 1-2 min; hard-refresh the site."+(clash?"\nNote: another book shares that month, so only one will show as this month's pick.":""));
    ["title","author","isbn","blurb","date"].forEach(i=>$(i).value="");$("cover").style.display="none";
    await load();
  }catch(err){say(err.message)}
}
init();
</script></body></html>
